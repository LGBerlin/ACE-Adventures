name: Test Permanent Launcher and Game Pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-packs:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot and matching templates
        run: |
          brew install --cask godot
          GODOT_APP="$(find /Applications -maxdepth 2 -name 'Godot*.app' -print -quit)"
          test -n "$GODOT_APP"
          echo "GODOT=$GODOT_APP/Contents/MacOS/Godot" >> "$GITHUB_ENV"
          RAW=$("$GODOT_APP/Contents/MacOS/Godot" --headless --version)
          VERSION=${RAW%%.official*}
          RELEASE_TAG=${VERSION/.stable/-stable}
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/$RELEASE_TAG/Godot_v${RELEASE_TAG}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/$VERSION"
          unzip -q templates.tpz -d template_unpack
          cp template_unpack/templates/* "$HOME/Library/Application Support/Godot/export_templates/$VERSION/"
      - name: Compile and export game PCK
        run: |
          mkdir -p dist
          "$GODOT" --headless --path godot --editor --import --quit
          "$GODOT" --headless --path godot --export-pack macOS "$GITHUB_WORKSPACE/dist/base-game.pck"
          test -s dist/base-game.pck
      - name: Validate launcher project
        run: |
          mkdir -p launcher-test/launcher
          cp launcher/project.godot launcher-test/project.godot
          cp launcher/bootstrap.gd launcher/bootstrap.tscn launcher/pack_updater.gd launcher-test/launcher/
          cp dist/base-game.pck launcher-test/base-game.pck
          "$GODOT" --headless --path launcher-test --editor --import --quit
          "$GODOT" --headless --path launcher-test --quit-after 5 > launcher.log 2>&1 || {
            cat launcher.log
            exit 1
          }
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Invalid call|Bundled game content is missing' launcher.log; then
            cat launcher.log
            exit 1
          fi
          cat launcher.log
      - uses: actions/upload-artifact@v4
        with:
          name: Development Game Pack
          path: dist/base-game.pck
