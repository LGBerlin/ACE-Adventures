name: Build Clean ACE Adventures 2 Mac App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'v2/**'
      - '.github/workflows/v2-app.yml'

permissions:
  contents: read

concurrency:
  group: ace-adventures-v2-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install certifi
      - name: Run game and updater unit tests
        run: |
          cd v2
          python -m unittest discover -s . -p 'test_*.py' -v
          python -m compileall -q .
      - name: Install packager
        run: python -m pip install pyinstaller certifi
      - name: Build standalone windowed app
        run: |
          cd v2
          pyinstaller --noconfirm --clean --windowed --name "ACE Adventures 2" --hidden-import app --hidden-import game --hidden-import pixel_art --collect-data certifi bootstrap.py
          test -d "dist/ACE Adventures 2.app/Contents/MacOS"
      - name: Validate packaged executable
        run: |
          test -x "v2/dist/ACE Adventures 2.app/Contents/MacOS/ACE Adventures 2"
          file "v2/dist/ACE Adventures 2.app/Contents/MacOS/ACE Adventures 2"
      - name: Test frozen app with v1.3.0 active
        run: |
          python3 - <<'PY'
          import json,os,subprocess,tempfile,time,pathlib
          from shutil import copy2
          app=pathlib.Path("v2/dist/ACE Adventures 2.app/Contents/MacOS/ACE Adventures 2").resolve()
          src=pathlib.Path("v2/updates/1.3.0")
          with tempfile.TemporaryDirectory() as temp:
              home=pathlib.Path(temp)
              root=home/"Library/Application Support/ACE Adventures 2"
              version=root/"updates/versions/1.3.0"
              version.mkdir(parents=True)
              for name in ("app.py","game.py","pixel_art.py"):
                  copy2(src/name,version/name)
              (root/"updates/active.json").write_text(json.dumps({"version":"1.3.0","directory":"1.3.0","previous":None}))
              env=os.environ.copy()
              env["HOME"]=str(home)
              proc=subprocess.Popen([str(app)],env=env,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
              try:
                  time.sleep(7)
                  if proc.poll() is not None:
                      out,err=proc.communicate(timeout=5)
                      raise AssertionError(f"Frozen app quit on launch: {proc.returncode}\n{out.decode(errors='replace')}\n{err.decode(errors='replace')}")
                  error_log=root/"startup-errors.log"
                  if error_log.exists():
                      raise AssertionError(error_log.read_text())
                  marker=json.loads((root/"updates/active.json").read_text())
                  assert marker["version"]=="1.3.0",f"Unexpected rollback: {marker}"
                  print("Frozen app remained running with v1.3.0 active; no rollback.")
              finally:
                  proc.terminate()
                  try:proc.wait(timeout=5)
                  except subprocess.TimeoutExpired:proc.kill()
          PY

      - name: Package artifact
        run: |
          cd v2/dist
          ditto -c -k --keepParent "ACE Adventures 2.app" "ACE Adventures 2 Mac.zip"
          shasum -a 256 "ACE Adventures 2 Mac.zip" > "ACE Adventures 2 Mac.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ACE Adventures 2 Unreleased Test Build
          path: |
            v2/dist/ACE Adventures 2 Mac.zip
            v2/dist/ACE Adventures 2 Mac.zip.sha256
