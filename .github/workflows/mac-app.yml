name: Build ACE Adventures macOS App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer version, matching the game source"
        required: true
        type: string
      publish:
        description: "Publish public release after validation (leave false for testing)"
        required: true
        type: boolean
        default: false

concurrency:
  group: ace-adventures-macos-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Godot
        run: |
          brew install --cask godot
          GODOT_APP="$(find /Applications -maxdepth 2 -name 'Godot*.app' -print -quit)"
          test -n "$GODOT_APP"
          echo "GODOT=$GODOT_APP/Contents/MacOS/Godot" >> "$GITHUB_ENV"

      - name: Show version and obtain matching export templates
        run: |
          "$GODOT" --headless --version
          RAW=$("$GODOT" --headless --version)
          VERSION=${RAW%%.official*}
          RELEASE_TAG=${VERSION/.stable/-stable}
          echo "Detected Godot: $VERSION"
          curl -fL --retry 3 -o templates.tpz "https://github.com/godotengine/godot/releases/download/$RELEASE_TAG/Godot_v${RELEASE_TAG}_export_templates.tpz"
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/$VERSION"
          unzip -q templates.tpz -d template_unpack
          cp template_unpack/templates/* "$HOME/Library/Application Support/Godot/export_templates/$VERSION/"

      - name: Import and export macOS application
        run: |
          mkdir -p build
          "$GODOT" --headless --path godot --editor --import --quit
          "$GODOT" --headless --path godot --export-release macOS "$GITHUB_WORKSPACE/build/ACE Adventures.app"
          test -d "build/ACE Adventures.app"

      - name: Smoke-test exported source before publishing
        run: |
          "$GODOT" --headless --path godot --quit-after 5 > game-smoke.log 2>&1 || {
            cat game-smoke.log
            exit 1
          }
          if grep -E 'SCRIPT ERROR|Parse Error|Parser Error|Failed to load script|Invalid call' game-smoke.log; then
            cat game-smoke.log
            exit 1
          fi
          cat game-smoke.log

      - name: Package app and checksum
        run: |
          cd build
          ditto -c -k --keepParent "ACE Adventures.app" "ACE Adventures Mac.zip"
          shasum -a 256 "ACE Adventures Mac.zip" | awk '{print $1}' > "ACE Adventures Mac.zip.sha256"

      - name: Upload build to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: ACE Adventures Mac Build
          path: |
            build/ACE Adventures Mac.zip
            build/ACE Adventures Mac.zip.sha256

      - name: Verify game source version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          assert re.fullmatch(r"[0-9]+[.][0-9]+[.][0-9]+", version), "Invalid release version"
          updater = Path("godot/updater.gd").read_text()
          assert f'const VERSION := "{version}"' in updater, "Release and updater versions disagree"
          main = Path("godot/main.gd").read_text()
          assert f"Game v{version}" in main, "UI version disagrees"
          print("Verified version:", version)
          PY

      - name: Publish immutable release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          if gh release view "v$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "Release v$RELEASE_VERSION exists; refusing to overwrite."
            exit 1
          fi
          gh release create "v$RELEASE_VERSION" \
            "build/ACE Adventures Mac.zip" \
            "build/ACE Adventures Mac.zip.sha256" \
            --title "ACE Adventures v$RELEASE_VERSION" \
            --notes "Validated Mac build. User saves remain outside the application." \
            --latest

      - name: Publish verified update manifest
        if: ${{ inputs.publish }}
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = os.environ["RELEASE_VERSION"]
          digest = Path("build/ACE Adventures Mac.zip.sha256").read_text().strip()
          assert len(digest) == 64 and all(c in "0123456789abcdef" for c in digest)
          manifest = {
            "version": version,
            "url": f"https://github.com/LGBerlin/ACE-Adventures/releases/download/v{version}/ACE%20Adventures%20Mac.zip",
            "sha256": digest
          }
          Path("godot-update.json").write_text(json.dumps(manifest, indent=2) + chr(10))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B manifest-update origin/main
          git add godot-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified update manifest for v$RELEASE_VERSION"
            git push origin HEAD:main
          else
            echo "Update manifest already current"
          fi
